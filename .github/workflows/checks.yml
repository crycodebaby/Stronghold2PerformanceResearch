# Game-free checks: Python test suites (temp folders only) and the docs linter. No game files or raw recordings.
# Same command as locally (python -I tools/run_checks.py); first GitHub run 2026-10-17, see docs/REPRODUCIBILITY.md.
# Only this repository is checked out: the hub-dependent case in test_audit_workdir is skipped, --audit/--e2e run locally.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-2022   # the tools target Windows paths, file locks and junctions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # verified locally with 3.14.3; 3.11 fails (os.path.isjunction)
      - name: Game-free checks
        run: python -I tools/run_checks.py
